[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlocr-bench"
version = "0.2.0"
description = "Benchmark and validate multilingual OCR engines against synthetic datasets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ocr", "benchmark", "multilingual", "cer", "wer", "dataset-validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Testing",
]

# Pillow and numpy back the image quality validator, which is core
# functionality rather than an optional extra.
dependencies = [
  "pillow>=9.0",
  "numpy>=1.21",
]

[project.optional-dependencies]
# Only needed to call a live OCR endpoint; validation and scoring work without it.
http = ["requests>=2.25"]
# Needed to inspect font cmaps and to regenerate images for scripts with
# combining marks. Pillow's own text layout only shapes text when it was built
# against libraqm, which prebuilt wheels usually are not, so shaping is done
# explicitly through HarfBuzz + FreeType.
render = [
  "fonttools>=4.38",
  "uharfbuzz>=0.30",
  "freetype-py>=2.3",
]
dev = [
  "pytest>=7.0",
  "requests>=2.25",
  "fonttools>=4.38",
  "uharfbuzz>=0.30",
  "freetype-py>=2.3",
]

[project.scripts]
mlocr-bench = "mlocr_bench.cli:main"

[project.urls]
Homepage = "https://github.com/linhongyu510/multilingual-ocr-test"
Issues = "https://github.com/linhongyu510/multilingual-ocr-test/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
